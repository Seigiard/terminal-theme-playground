<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal Theme Playground</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23325cc0%22/><rect x=%223%22 y=%223%22 width=%224%22 height=%224%22 fill=%22%23f7f7f7%22/><rect x=%229%22 y=%229%22 width=%224%22 height=%224%22 fill=%22%2360cb00%22/></svg>">
</head>
<body>
  <header class="app-header">
    <h1>Terminal Theme Playground</h1>
    <p class="tagline">Preview Claude Code / opencode / pi themes under any 16-color ANSI palette. Slots, not hex.</p>
  </header>

  <main class="app-main">
    <aside id="palette-panel" class="palette-panel" aria-label="Terminal palette"></aside>

    <section class="workspace">
      <nav class="tabs" role="tablist" aria-label="Tools">
        <button class="tab" role="tab" data-tab="claude">Claude Code</button>
        <button class="tab" role="tab" data-tab="opencode">opencode</button>
        <button class="tab" role="tab" data-tab="pi">pi</button>
      </nav>

      <div class="tab-panels">
        <section class="tab-panel" data-panel="claude" role="tabpanel">
          <div class="panel-preview" id="preview-claude"></div>
          <div class="panel-editor" id="editor-claude"></div>
          <div class="panel-json" id="json-claude"></div>
        </section>
        <section class="tab-panel" data-panel="opencode" role="tabpanel">
          <div class="panel-preview" id="preview-opencode"></div>
          <div class="panel-editor" id="editor-opencode"></div>
          <div class="panel-json" id="json-opencode"></div>
        </section>
        <section class="tab-panel" data-panel="pi" role="tabpanel">
          <div class="panel-preview" id="preview-pi"></div>
          <div class="panel-editor" id="editor-pi"></div>
          <div class="panel-json" id="json-pi"></div>
        </section>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
